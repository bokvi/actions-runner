version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # The images the Dockerfile copies from: Node.js for the tool cache (stay on Node 24, the major
  # in the README) and the AWS CLI.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directories:
      - /prewarm
      - /prewarm/npm
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
