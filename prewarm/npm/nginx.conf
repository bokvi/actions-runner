worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
    # No package names or private dependency inventory in access logs.
    map $uri $cache_kind {
        default metadata;
        ~\.tgz$ tarball;
    }
    log_format cache '$status $cache_kind $upstream_cache_status';
    access_log /dev/stdout cache;
    error_log /dev/stderr error;
    proxy_cache_path /var/cache/nginx/npm levels=1:2 keys_zone=npm:20m
        max_size=10g inactive=30d use_temp_path=off;
    proxy_temp_path /tmp/proxy;
    client_body_temp_path /tmp/client;
    resolver 127.0.0.11 valid=300s ipv6=off;

    server {
        listen 8080;
        set $registry registry.npmjs.org;
        proxy_pass_request_headers off;
        proxy_set_header Host registry.npmjs.org;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name registry.npmjs.org;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        location = /health { access_log off; return 200 'ok\n'; }
        # npm's existing security checks are read-only queries, not publishing.
        # Forward these two POST endpoints without caching or credentials.
        location ~ ^/-/npm/v1/security/(advisories/bulk|audits/quick)$ {
            if ($request_method != POST) { return 405; }
            client_max_body_size 2m;
            proxy_set_header Host registry.npmjs.org;
            proxy_set_header Connection "";
            proxy_set_header Content-Type application/json;
            proxy_set_header Content-Encoding $http_content_encoding;
            proxy_pass https://$registry$request_uri;
        }
        location / {
            # Clients may request upstream content, never publish or replace it.
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            proxy_pass https://$registry$request_uri;
            proxy_cache npm;
            proxy_cache_key $request_uri;
            proxy_cache_lock on;
            proxy_cache_valid 200 30d;
            # npm's CDN adds a bot cookie even to public immutable tarballs.
            # Requests carry no user credentials; never forward that cookie or
            # let it disable caching of the public registry response.
            proxy_ignore_headers Set-Cookie;
            proxy_hide_header Set-Cookie;
            # Respect upstream Cache-Control; version metadata is not immutable.
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
